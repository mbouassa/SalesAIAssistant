meta:
  company_id: "persona_notion"
  name: "Full Notion Demo"
  description: Guided demo of Notion's marketplace, productivity features, and ways to organize life and work
  estimated_duration: "2-3 minutes"
  start_url: "https://www.notion.com/templates?assetsVersion=23.13.20251230.1157"

triggers:
  - "give me a demo"
  - "show me everything"
  - "full tour"
  - "walk me through"

steps:
  - id: welcome_marketplace
    screen: dashboard
    action:
      type: "navigate"
      target: "Marketplace"
    narrate_intent: "Welcome to the Notion Template Marketplace! Here, you can browse over 30,000 templates created by our community and experts. Whether you’re managing projects, tracking habits, or planning your next big idea, there’s a template to get you started instantly."

  - id: explore_personal_productivity
    screen: personal_productivity
    action:
      type: "click"
      target: "Personal Productivity20047 templates"
    narrate_intent: "Let’s check out Personal Productivity templates. These ready-made setups help you streamline tasks, manage projects, and maximize your efficiency—perfect for those who want to stay organized both personally and professionally."

  - id: highlight_habit_tracking
    screen: habit_tracking
    action:
      type: "click"
      target: "Habit Tracking"
    narrate_intent: "Building good habits is easier with Notion’s Habit Tracking templates. Monitor your daily routines, set personal goals, and visualize your progress so you can stay on track and motivated all year long."

  - id: show_personal_planner
    screen: personal_planner
    action:
      type: "click"
      target: "Personal Planner8002 templates"
    narrate_intent: "Need help organizing your schedule? The Personal Planner section offers daily, weekly, and monthly planners to help you balance your commitments, set reminders, and achieve your goals, all in one flexible workspace."

  - id: feature_school_templates
    screen: school
    action:
      type: "click"
      target: "School11686 templates"
    narrate_intent: "Notion is also a favorite among students! Our School templates make it easy to manage study schedules, keep class notes organized, and track assignments—making academic success more manageable."

  - id: pricing_overview
    screen: pricing
    action:
      type: "click"
      target: "Pricing"
    narrate_intent: "Curious about pricing? Notion offers a generous Free plan and affordable options for individuals, teams, and enterprises. You can start for free and upgrade as your needs grow, unlocking advanced collaboration, security, and automation features."

  - id: contact_sales
    screen: contact_sales
    action:
      type: "click"
      target: "Contact sales"
    narrate_intent: "If you want a personalized demo or have questions about enterprise features, you can easily reach out to our sales team from here. We’re happy to help you explore the best way to set up Notion for your unique needs!"

  - id: demo_close
    screen: dashboard
    action:
      type: "navigate"
      target: "Marketplace"
    narrate_intent: "That’s a quick tour of what you can do with Notion! With thousands of customizable templates and powerful tools, you have everything you need to organize your personal and professional life in one place."

fallback_narration:
  action_failed: "Hmm, that didn't work. Let me try another way."
  element_not_found: "I'm having trouble finding that. Let me describe it instead."
  demo_interrupted: "Got it — I'll pause here. What would you like to know?"