# Healing Path Demo Playbook
# Full guided tour of The Inner Child Journey platform
# Uses screen descriptions from persona for dynamic LLM-generated narration

meta:
  company_id: "persona_healingpath"
  name: "Full Healing Path Demo"
  description: "Walk through the core features: journaling, meditation, booklets, and community"
  estimated_duration: "2-3 minutes"
  start_url: "https://healing-path.vercel.app/dashboard"

# Trigger phrases that activate this playbook
triggers:
  - "give me a demo"
  - "show me everything"
  - "full tour"
  - "walk me through"
  - "show me how it works"

# Demo steps - uses screen IDs from persona.screens for context
steps:
  # === DASHBOARD OVERVIEW ===
  - id: "dashboard_overview"
    screen: "dashboard"
    action:
      type: "wait"
      duration: 0.5
    narrate_intent: "welcome user to the dashboard, briefly explain it's their daily home base with journaling, meditation, and community"

  # === JOURNALING SECTION ===
  - id: "open_journaling"
    screen: "journaling"
    action:
      type: "click"
      target: "Start Today's Reflection"
      intent: "journaling or reflection feature"
    narrate_intent: "introduce the daily journaling practice, mention it only takes a few minutes"

  - id: "describe_journaling"
    screen: "journaling"
    action:
      type: "wait"
      duration: 0.5
    narrate_intent: "explain the weekly journey calendar and how each day has a theme"

  - id: "open_writing_space"
    screen: "journaling_active"
    action:
      type: "click"
      target: "Begin Today's Sacred Reflection"
      intent: "start or begin the reflection"
    narrate_intent: "show the actual writing space, emphasize it's a safe sanctuary with no pressure"

  - id: "return_from_journaling"
    action:
      type: "navigate"
      target: "https://healing-path.vercel.app/dashboard"
    narrate_intent: "transition back to dashboard to show other features"

  # === MEDITATION SECTION ===
  - id: "open_meditation"
    screen: "meditation"
    action:
      type: "click"
      target: "Listen Now"
      intent: "audio or meditation feature"
    narrate_intent: "introduce the guided meditations, mention they're short and nurturing"

  - id: "describe_meditation"
    screen: "meditation"
    action:
      type: "wait"
      duration: 0.5
    narrate_intent: "explain the inner child meditation and how it helps reconnect with your younger self"

  - id: "return_from_meditation"
    action:
      type: "navigate"
      target: "https://healing-path.vercel.app/dashboard"
    narrate_intent: "transition to show the booklets"

  # === BOOKLETS SECTION ===
  - id: "open_booklets"
    screen: "booklets"
    action:
      type: "click"
      target: "Sacred Library"
      intent: "booklet or library feature"
    narrate_intent: "introduce the printable healing guides, mention they're beautiful and can be kept offline"

  - id: "describe_booklets"
    screen: "booklets"
    action:
      type: "wait"
      duration: 0.5
    narrate_intent: "highlight the current booklet and that more guides unlock as you progress"

  - id: "return_from_booklets"
    action:
      type: "navigate"
      target: "https://healing-path.vercel.app/dashboard"
    narrate_intent: "transition to show the community"

  # === COMMUNITY SECTION ===
  - id: "open_community"
    screen: "sister_circle"
    action:
      type: "click"
      target: "Sister Circle"
      intent: "community or sister circle tab"
    narrate_intent: "introduce the Sister Circle community, mention thousands of women sharing their healing"

  - id: "describe_community"
    screen: "sister_circle"
    action:
      type: "scroll"
      target: "down"
    narrate_intent: "show real posts from members, emphasize it's a safe supportive space"

  # === CLOSING ===
  - id: "demo_complete"
    action:
      type: "wait"
      duration: 0.5
    narrate_intent: "wrap up the demo warmly, summarize the core features, ask if they have questions"

# What to say if demo fails
fallback_narration:
  action_failed: "Hmm, that didn't work as expected. Let me try another way."
  element_not_found: "I'm having trouble finding that. Let me describe it for you instead."
  demo_interrupted: "Got it — I'll pause here. What would you like to know more about?"
